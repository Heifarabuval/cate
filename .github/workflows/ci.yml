name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

# A new push to a pull request cancels the run of the commit it replaces, so
# superseded runs do not hold the macOS runners. Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    runs-on: ${{ matrix.os }}
    # Without this, a hung step (e.g. a test leaving a child process that holds
    # the step's stdout pipe open) runs until GitHub's 6-hour default. Bound it
    # so CI fails fast and surfaces the culprit instead of hanging for hours.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install setuptools (needed by node-gyp)
        run: pip install setuptools

      # npm ci honors the committed package-lock.json so PR runs are
      # deterministic, so a fresh upstream release cannot break an unrelated
      # PR. It fails loudly if package.json and the
      # lockfile drift out of sync; regenerate with `npm install` locally.
      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Layering rules
        run: npm run lint:deps

      - name: Unit tests (including agent setup and providers)
        # Forward logs directly; Vitest's worker console RPC can still be
        # pending when a native-network test tears down its environment.
        run: npm run test -- --disableConsoleIntercept --exclude src/runtime/connect/connect.test.ts

      # Real native WebRTC/Noise handshakes share the runner's scheduling and
      # network resources. Run them without the rest of the suite competing
      # for CPU, so a busy runner does not turn key checks into timeouts.
      - name: Cate Connect integration tests
        run: npm run test -- src/runtime/connect/connect.test.ts --maxWorkers=1 --disableConsoleIntercept

      # E2E and Electron smoke tests run locally only. Keep the npm scripts
      # available for browser and full-app validation.

  # The agence CLI (tools/agence) runs on the system python3: macOS ships 3.9,
  # so test the oldest version. Not shipped on Windows.
  agence:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    # The suite takes 9 to 10 minutes on the macOS runner.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.9"
      - name: Agence tests
        run: npm run test:agence
